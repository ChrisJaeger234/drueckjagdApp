# Veröffentlicht den PWA-Machbarkeitstest (spikes/pwa-test) auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: PWA-Test auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'spikes/pwa-test/**'
      - '.github/workflows/pwa-test-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/pwa-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/pwa-test/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spikes/pwa-test/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
