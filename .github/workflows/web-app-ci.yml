name: Web-App CI

on:
  pull_request:
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - '.github/workflows/web-app-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /drueckjagdApp/app/
      - name: Rauchtest im Browser (Playwright)
        run: |
          npm install -g playwright@1
          npx -y playwright@1 install --with-deps chromium
          (BASE_PATH=/drueckjagdApp/app/ npx vite preview --port 4180 --strictPort &)
          npx -y wait-on@8 http://localhost:4180/drueckjagdApp/app/
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4180/drueckjagdApp/app/ npm run e2e
