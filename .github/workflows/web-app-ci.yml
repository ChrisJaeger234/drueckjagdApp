name: Web-App CI

on:
  pull_request:
    paths:
      - 'web-app/**'
      - 'supabase/**'
      - '.github/workflows/web-app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web-app/**'
      - 'supabase/**'
      - '.github/workflows/web-app-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /drueckjagdApp/app/
      - name: Rauchtest im Browser (Playwright)
        run: |
          npm install -g playwright@1
          npx -y playwright@1 install --with-deps chromium
          (BASE_PATH=/drueckjagdApp/app/ npx vite preview --port 4180 --strictPort &)
          npx -y wait-on@8 http://localhost:4180/drueckjagdApp/app/
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4180/drueckjagdApp/app/ npm run e2e

  # Anmeldung, Profil und Profilbild gegen einen lokalen Supabase-Stack mit allen
  # Migrationen aus supabase/ (keine Verbindung zum Produktivprojekt).
  e2e-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          # Feste Version: „latest“ fragt die GitHub-API ab und scheitert gelegentlich am Rate-Limit.
          version: 2.122.1
      - name: Lokalen Supabase-Stack starten
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Datenbanktests (pgTAP, RLS-Regeln)
        run: supabase test db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x
      - name: Edge Function „notify“ prüfen und lokal starten
        # Läuft mit Deno direkt neben dem Stack. Test-VAPID-Schlüssel nur für diesen Lauf; statt an
        # echte Push-Dienste geht die verschlüsselte Anfrage an den Empfänger im Push-Test.
        run: |
          deno check supabase/functions/notify/index.ts
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          (SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$PUBLISHABLE_KEY" SUPABASE_SERVICE_ROLE_KEY="$SECRET_KEY" \
            VAPID_PUBLIC_KEY=BLpnMZNQaUhnryQMEgYDNRy-IlD1_1OE8ZpD8zKLmuAoZCiPm_2_WugaHksV7sFaRa4GZ1Y0X62XZ3aBP6dFNsk \
            VAPID_PRIVATE_KEY=rYaDDR7ffHvHVcGnNUjXEyLYnLA3RS22hs0nZwb0dXs VAPID_SUBJECT=mailto:test@example.com \
            PUSH_TEST_SINK_URL=http://127.0.0.1:54399/push \
            deno run -A supabase/functions/notify/index.ts > /tmp/notify.log 2>&1 &)
          npx -y wait-on@8 -t 120000 tcp:127.0.0.1:8000
      - name: App gegen den lokalen Stack bauen
        working-directory: web-app
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          npm ci
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" npx vite build --outDir /tmp/wa-local
      - name: Ende-zu-Ende-Test (Playwright)
        working-directory: web-app
        run: |
          npm install -g playwright@1
          npx -y playwright@1 install --with-deps chromium
          (npx vite preview --outDir /tmp/wa-local --port 4181 --strictPort &)
          npx -y wait-on@8 http://localhost:4181/
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/auth-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/groups-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/reviere-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/hunts-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/offline-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/offline-maps-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ node e2e/live-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ DEBUG_CHAT=1 node e2e/chat-local.mjs
          NODE_PATH=$(npm root -g) APP_URL=http://localhost:4181/ FUNCTIONS_URL=http://127.0.0.1:8000 node e2e/push-local.mjs
      - name: Protokoll der Edge Function
        if: always()
        run: cat /tmp/notify.log || true
